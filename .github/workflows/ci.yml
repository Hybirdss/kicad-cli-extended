name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"      # weekly, so a new KiCad 10.x release is tested before users hit it

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "0"            # exercise the real default encodings
  KICAD_TAG: "10.0.7"        # demo fixtures (KiCad/kicad-source-mirror tag)

jobs:
  unit:
    name: unit · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - name: Generated command and skill references are current
        run: python scripts/gen_skill.py --check
      - name: Unit tests (implicit-encoding use is an error)
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests/test_core.py -v
      - name: Installed command works from another directory
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          kce --version
          kce --json skill path

  e2e-linux:
    name: e2e · ubuntu · ${{ matrix.lang }} (full suite, real KiCad)
    # PLY export needs OCCT 7.7+; Ubuntu 24.04 supplies 7.6.
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lang: [C.UTF-8, ko_KR.UTF-8]   # kicad-cli translates its reports; kce must not depend on English text
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad 10 (PPA kicad/kicad-10.0-releases)
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get -o APT::Architecture-Variants= update
          sudo apt-get -o APT::Architecture-Variants= install --yes --no-install-recommends \
            kicad kicad-symbols kicad-footprints kicad-templates xvfb
          version=$(kicad-cli version)
          echo "$version"
          test "${version%%.*}" = 10
          /usr/bin/python3 -c "import pcbnew; print('pcbnew', pcbnew.Version())"
      - name: Generate the Korean locale
        if: matrix.lang == 'ko_KR.UTF-8'
        run: sudo locale-gen ko_KR.UTF-8
      - run: python -m pip install ".[test]"
      - run: python scripts/fetch_fixtures.py --tag "$KICAD_TAG"
      - name: Check that kicad-cli writes its reports in Korean
        if: matrix.lang == 'ko_KR.UTF-8'
        env:
          LANG: ko_KR.UTF-8
          LC_ALL: ko_KR.UTF-8
          KICAD_CONFIG_HOME: ${{ runner.temp }}/kicad-config-empty   # no library tables, so DRC has findings
        run: |
          cp -r .fixtures/kicad-src/demos/pic_programmer "$RUNNER_TEMP/"
          kicad-cli pcb drc --format json -o "$RUNNER_TEMP/drc.json" "$RUNNER_TEMP/pic_programmer/pic_programmer.kicad_pcb"
          python - "$RUNNER_TEMP/drc.json" <<'EOF'
          import json, sys
          text = " ".join(v["description"] for v in json.load(open(sys.argv[1], encoding="utf-8"))["violations"])
          print(text[:200])
          sys.exit(not any("\uac00" <= ch <= "\ud7a3" for ch in text))
          EOF
      - run: python scripts/ci_doctor.py
      - name: Unit + full E2E suite
        env:
          KCE_FORCE_INSTALLED: "1"
          LANG: ${{ matrix.lang }}
          LC_ALL: ${{ matrix.lang }}
        run: xvfb-run -a python -X warn_default_encoding -W error::EncodingWarning -m pytest tests -v -rA

  e2e-windows:
    name: e2e · windows (smoke, real KiCad)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad 10 (Chocolatey)
        run: choco install kicad --version=10.0.7 --yes --no-progress
      - run: python -m pip install ".[test]"
      - run: python scripts/fetch_fixtures.py --tag "$env:KICAD_TAG"
      - run: python scripts/ci_doctor.py
      - name: E2E smoke subset
        env:
          KCE_FORCE_INSTALLED: "1"
        run: python -m pytest tests -v -rA -m smoke

      - name: Windows feature contracts (implicit encoding is an error)
        env:
          KCE_FORCE_INSTALLED: "1"
          PYTHONIOENCODING: "cp1252"
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest tests/test_core.py tests/test_contract.py tests/test_board.py tests/test_intent.py tests/test_serve.py -q

  e2e-macos:
    name: e2e · macos (smoke, real KiCad)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad 10 (Homebrew cask)
        run: brew install --cask kicad     # the cask does not put kicad-cli on PATH
      - run: python -m pip install ".[test]"
      - run: python scripts/fetch_fixtures.py --tag "$KICAD_TAG"
      - name: Check KiCad through kce (finds the cask on its own)
        run: python scripts/ci_doctor.py
      - name: E2E smoke subset
        env:
          KCE_FORCE_INSTALLED: "1"
        run: python -m pytest tests -v -rA -m smoke
