name: Hardware release artifacts
on:
  push:
    tags: ['hw-*']
permissions:
  contents: read
env:
  PROJECT: hw/sensor-hub
  # Replace this placeholder with the reviewed commit containing the landing commands.
  KCE_SPEC: git+https://github.com/Hybirdss/kicad-cli-extended@REPLACE_WITH_REVIEWED_SHA
  PYTHONUTF8: "1"
  KCE_TIMEOUT: "900"
jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install KiCad on Linux
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints kicad-templates kicad-packages3d xvfb
      - name: Install KiCad on Windows
        if: runner.os == 'Windows'
        run: choco install kicad --version=10.0.7 --yes --no-progress
      - name: Install reviewed kce and assert tool versions
        run: |
          python -m pip install "$KCE_SPEC"
          mkdir -p out
          kce --json info version > out/versions.json
          python -c "import json; d=json.load(open('out/versions.json', encoding='utf-8')); assert d['kicad'].startswith('10.0.7'), d"
          kce --json info describe run
          kce lib init-global-tables
          kce --json info doctor > out/doctor.json
      - name: Assert tag matches title block revision
        run: |
          kce --json -p "$PROJECT" sch info > out/schematic.json
          python -c "import json,os; d=json.load(open('out/schematic.json', encoding='utf-8')); assert os.environ['GITHUB_REF_NAME'] == 'hw-' + str(d.get('title_block', {}).get('rev', '')), d"
      - name: Gate release inputs
        run: |
          kce --json -p "$PROJECT" check erc --fail-on error > out/erc.json
          kce --json -p "$PROJECT" check drc --fail-on error > out/drc.json
      - name: Build fabrication artifacts
        run: kce --json -p "$PROJECT" fab package --preset jlcpcb --fail-on-drc --no-step --output-dir out/fab > out/package.json
      - name: Assert clean working tree
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-release-${{ matrix.os }}
          path: out/
